name: Mock App CI/CD Test Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to promote to"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: "Existing image tag to deploy (e.g. v1.0.0, sha-abc123def456). Blank = promote the image built from the selected tag."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name == 'main' }}

env:
  IMAGE_NAME: mock-app

jobs:
  # 1. Quality gate. No `if:` — runs on every trigger and gates both deploy paths.
  check:
    name: Code & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py

  # 2. The ONLY job that builds a container. Push to main, nothing else.
  build-and-deploy-dev:
    name: Build & Deploy to Dev
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${{ vars.GAR_REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA=$(git rev-parse --short=12 HEAD)

          echo "image_base=${IMAGE}"                                >> "$GITHUB_OUTPUT"
          echo "deploy_tag=sha-${SHORT_SHA}"                        >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"                             >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:sha-${SHORT_SHA},${IMAGE}:dev-latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=mock-app
          cache-to: type=gha,mode=max,scope=mock-app

      - name: Deploy revision to Cloud Run (Dev)
        env:
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICE_NAME}" ]]; then
            echo "::error::SERVICE_NAME is not set on the dev environment."
            exit 1
          fi

          DEPLOY_IMAGE="${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.deploy_tag }}"
          echo "Deploying ${DEPLOY_IMAGE} to dev service ${SERVICE_NAME}"

          gcloud run services update "${SERVICE_NAME}" \
            --image "${DEPLOY_IMAGE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "mock-app-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --update-env-vars "APP_VERSION=${{ steps.meta.outputs.deploy_tag }},GIT_SHA=${{ steps.meta.outputs.short_sha }}"

  # 3. Promote an existing image. Never builds. Serves both dev and prod.
  promote:
    name: Promote to ${{ inputs.target_env }}
    needs: check
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve which image to promote
        id: resolve
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE="${{ vars.GAR_REGISTRY }}/${{ env.IMAGE_NAME }}"

          if [[ -n "${IMAGE_TAG_INPUT}" ]]; then
            # Redeploy / rollback: the image already exists under this tag.
            SOURCE_IMAGE="${IMAGE}:${IMAGE_TAG_INPUT}"
            DEPLOY_TAG="${IMAGE_TAG_INPUT}"
            if [[ "${IMAGE_TAG_INPUT}" == sha-* ]]; then
              GIT_SHA="${IMAGE_TAG_INPUT#sha-}"
            else
              GIT_SHA="unknown"
            fi
          else
            # Release: promote the image dev already built from this tagged commit.
            if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
              echo "::error::Run this from a v*.*.* tag, or supply image_tag."
              exit 1
            fi
            GIT_SHA=$(git rev-parse --short=12 HEAD)
            SOURCE_IMAGE="${IMAGE}:sha-${GIT_SHA}"
            DEPLOY_TAG="${REF_NAME}"
          fi

          echo "image_base=${IMAGE}"          >> "$GITHUB_OUTPUT"
          echo "source_image=${SOURCE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${DEPLOY_TAG}"     >> "$GITHUB_OUTPUT"
          echo "git_sha=${GIT_SHA}"           >> "$GITHUB_OUTPUT"

          echo "Promoting ${SOURCE_IMAGE} as ${DEPLOY_TAG}"

      - name: Verify image exists in Artifact Registry
        run: |
          set -euo pipefail
          gcloud artifacts docker images describe \
            "${{ steps.resolve.outputs.source_image }}" --quiet > /dev/null

      - name: Tag image in Artifact Registry (no rebuild)
        env:
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          SOURCE="${{ steps.resolve.outputs.source_image }}"
          IMAGE="${{ steps.resolve.outputs.image_base }}"
          TAG="${{ steps.resolve.outputs.deploy_tag }}"

          # Stamp the release tag, unless we are already deploying that exact tag.
          if [[ "${SOURCE}" != "${IMAGE}:${TAG}" ]]; then
            echo "Tagging ${SOURCE} -> ${IMAGE}:${TAG}"
            gcloud artifacts docker tags add "${SOURCE}" "${IMAGE}:${TAG}"
          fi

          # Move this environment's pointer.
          echo "Tagging ${SOURCE} -> ${IMAGE}:${TARGET_ENV}-latest"
          gcloud artifacts docker tags add "${SOURCE}" "${IMAGE}:${TARGET_ENV}-latest"

      - name: Deploy revision to Cloud Run
        env:
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICE_NAME}" ]]; then
            echo "::error::SERVICE_NAME is not set on the ${TARGET_ENV} environment."
            exit 1
          fi

          DEPLOY_IMAGE="${{ steps.resolve.outputs.image_base }}:${{ steps.resolve.outputs.deploy_tag }}"
          echo "Deploying ${DEPLOY_IMAGE} to ${TARGET_ENV} service ${SERVICE_NAME}"

          gcloud run services update "${SERVICE_NAME}" \
            --image "${DEPLOY_IMAGE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "mock-app-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --update-env-vars "APP_VERSION=${{ steps.resolve.outputs.deploy_tag }},GIT_SHA=${{ steps.resolve.outputs.git_sha }}"
